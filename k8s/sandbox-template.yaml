apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxTemplate
metadata:
  name: migratowl-sandbox-template
  namespace: default
spec:
  # No explicit network policy: since agent-sandbox v0.2.x the controller
  # applies a strict managed default (blocks internal cluster IPs, VPC
  # subnets, and the node metadata server; external egress to package
  # registries stays open). Set spec.networkPolicyManagement: Unmanaged
  # to opt out.
  podTemplate:
    spec:
      containers:
        - name: sandbox
          image: sandbox-runtime:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8888
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 6Gi
