[project]
name = "migratowl"
version = "0.6.0"
description = "AI-powered dependency migration analyzer"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.6",
    "fastapi>=0.115.0",
    "langchain-kubernetes[agent-sandbox]>=0.4.0",
    "langchain-anthropic",
    "langchain-openai",
    "pydantic>=2.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv",
    "python-multipart>=0.0.31",
    "httpx>=0.27",
    "packaging>=24.0",
    "defusedxml>=0.7.1",
    "html2text>=2024.2.26",
    "langfuse",
    "aiosqlite>=0.20",
    "langgraph-checkpoint-sqlite>=2.0",
]

[tool.uv]
# langchain-kubernetes 0.4.0 declares `k8s-agent-sandbox>=0.1.0` (no upper bound),
# but the client API changed in 0.3+: SandboxClient.__init__ dropped `template_name`
# in favour of `connection_config`. Resolving to 0.3+ fails at runtime with
# `TypeError: SandboxClient.__init__() got an unexpected keyword argument 'template_name'`.
# Unit tests do not catch this (the sandbox backend is mocked) — only an E2E scan does.
# Lift this cap once langchain-kubernetes supports the newer client.
constraint-dependencies = [
    "k8s-agent-sandbox<0.3",
    # Security floor on a transitive dep (pulled in via google-auth / kubernetes).
    # Its direct dependents only declare open lower bounds, so the resolver would
    # otherwise keep the vulnerable 46.0.7 (GHSA-537c-gmf6-5ccf).
    "cryptography>=48.0.1",
    # Security floor: pyasn1 0.6.3 has 3 known vulns (PYSEC-2026-3455/3456/3457),
    # fixed in 0.6.4. Pulled in transitively via google-auth -> pyasn1-modules;
    # dependents declare open lower bounds, so pin the floor to the fixed release.
    "pyasn1>=0.6.4",
    # Security floor: setuptools <83.0.0 has GHSA-h35f-9h28-mq5c (MANIFEST.in
    # exclusion bypass). Dev/build-only dep; not in the runtime export.
    "setuptools>=83.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "pytest-cov>=5.0",
    "ruff",
    "mypy>=1.10",
    "bandit[toml]>=1.7",
    "langgraph-cli[inmem]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["migratowl*"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
