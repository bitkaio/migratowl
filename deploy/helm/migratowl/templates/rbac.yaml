{{- if .Values.rbac.create }}
{{- $ns := include "migratowl.sandboxNamespace" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "migratowl.fullname" . }}-sandbox
  namespace: {{ $ns }}
  labels:
    {{- include "migratowl.labels" . | nindent 4 }}
rules:
  {{- if eq .Values.sandbox.mode "raw" }}
  # raw mode: ephemeral sandbox Pods, their exec/log streams and the deny-all NetworkPolicy
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "delete"]
  {{- else }}
  # agent-sandbox mode: the controller turns a SandboxClaim into the sandbox pod
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxtemplates"]
    verbs: ["get", "list"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "migratowl.fullname" . }}-sandbox
  namespace: {{ $ns }}
  labels:
    {{- include "migratowl.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "migratowl.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "migratowl.fullname" . }}-sandbox
{{- end }}
